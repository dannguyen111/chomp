name: referee

# The gate that MISSION section 7 makes load-bearing: a claim becomes `proven`
# only after an adversarial reader who cannot see its provenance accepts it
# twice, at two temperatures. Nothing else in the pipeline can promote a claim,
# and nothing else can kill a false one.
#
# Was manual only, deliberately: a session ending at 3am should not be able to
# promote its own work while nobody is looking. Autopilot changes that, and the
# tradeoff is accepted knowingly, with three things standing in for the human:
#
#   1. Only an AGREED, finished, explicit accept can promote. A split verdict
#      is `unresolved` and leaves the claim open -- run 8 exercised exactly
#      that path and correctly refused to promote on a 0.3-accept/0.8-reject.
#   2. The ledger is append-only, so every promotion is reversible, and the
#      operator has reverted three bad ones already.
#   3. The daily digest reports every status change the morning after.
#
# It is still NOT chained onto `session`: it runs on its own cron six hours
# later, so it reads a ledger the session has finished writing and pushed.

on:
  schedule:
    # 09:17 UTC, six hours after the session cron. A session can run 355
    # minutes, so this is the first hour at which yesterday's work is reliably
    # committed and pushed. If it is not -- a long session plus a scheduler
    # delay -- the shared `chomp` concurrency group queues this run behind it
    # rather than letting the two race the ledger.
    #
    # :17 for the same reason as the session: GitHub's scheduler queues hardest
    # on the hour, and the exact minute is worth nothing to us.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      claim_id:
        description: "Claim id, or 'auto' for every refereeable claim"
        default: "auto"
      max_spend:
        description: "USD cap per claim"
        default: "1.00"
      max_claims:
        description: "In auto mode, referee at most this many"
        default: "3"

permissions:
  contents: write

concurrency:
  group: chomp
  cancel-in-progress: false

jobs:
  referee:
    runs-on: ubuntu-latest
    # Wall clock is the only limit that has ever come close: run 4 used 95 of
    # 120 minutes, while spending $0.24 of its $0.60 cap. A job killed at the
    # timeout loses the verdict entirely, and the headroom costs nothing unless
    # it is used.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Gate on autopilot and budget
        id: gate
        run: |
          set -euo pipefail
          # One switch for the whole loop: the same file that gates `session`.
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f runs/AUTOPILOT ]; then
            echo "Autopilot off. Commit an empty runs/AUTOPILOT to enable the cron."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SPEND=0.75; CLAIMS=1; CLAIM=auto
          else
            SPEND="${{ inputs.max_spend || '1.00' }}"
            CLAIMS="${{ inputs.max_claims || '3' }}"
            CLAIM="${{ inputs.claim_id || 'auto' }}"
          fi
          { echo "spend=$SPEND"; echo "claims=$CLAIMS"; echo "claim=$CLAIM"; } >> "$GITHUB_OUTPUT"
          REMAIN=$(python -c "import json;d=json.load(open('BUDGET.json'));print(d['cap']-d['spent'])")
          echo "Remaining: \$$REMAIN   cap for this run: \$$SPEND   target: $CLAIM"
          python -c "import sys;sys.exit(0 if $REMAIN >= $SPEND else 1)" \
            && echo "go=true" >> "$GITHUB_OUTPUT" \
            || { echo "Budget below this run's cap."; echo "go=false" >> "$GITHUB_OUTPUT"; }

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.go == 'true'
        run: pip install requests

      # The referee gets the solver: an adversarial reader that cannot run a
      # counterexample search is just a second opinion on prose.
      - name: Restore solver
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            GROUND_TRUTH/solver
            GROUND_TRUTH/cache
          key: solver-${{ hashFiles('GROUND_TRUTH/solver.cpp') }}
          fail-on-cache-miss: true

      - name: What is refereeable
        if: steps.gate.outputs.go == 'true'
        run: python -m harness.referee --list

      - name: Referee
        if: steps.gate.outputs.go == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x GROUND_TRUTH/solver
          python -m harness.referee "${{ steps.gate.outputs.claim }}" \
            --root . \
            --max-spend "${{ steps.gate.outputs.spend }}" \
            --max-claims "${{ steps.gate.outputs.claims }}"

      - name: Commit verdicts
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          git config user.name "chomp-harness"
          git config user.email "noreply@github.com"
          git add -A BUDGET.json LEDGER
          git diff --cached --quiet && exit 0
          git commit -m "referee ${{ github.run_number }} (${{ inputs.claim_id }})"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "Push failed after 3 attempts."; exit 1

      - name: Verdict summary
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          for f in LEDGER/referee/*.json; do
            [ -f "$f" ] || continue
            { echo "### $(basename "$f" .json)"; echo '```json'
              python -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:d[k] for k in ('claim','agreed','final')},indent=2))" "$f"
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
